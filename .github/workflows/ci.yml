name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser
      - run: pnpm run test:production
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: accessibility-and-browser-reports
          path: |
            playwright-report/
            test-results/
            test-results-production/
          retention-days: 14
